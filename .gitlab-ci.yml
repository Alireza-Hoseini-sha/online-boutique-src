# ============================================================
# Update Dev GitOps
# ============================================================

update-dev:
  stage: deploy
  image: alpine:3.22

  rules:
    - changes:
        - src/**/*

  script:
    - apk add --no-cache git yq

    - git clone "https://oauth2:${GITOPS_TOKEN}@gitlab.local/online-boutique-gitops.git"

    - cd online-boutique-gitops

    - |
      set -eu

      changed=0

      for file in ../*.changed; do
        [ -f "$file" ] || continue

        changed=1

        service="$(awk '{print $1}' "$file")"
        tag="$(awk '{print $2}' "$file")"

        echo "Updating DEV:"
        echo "  Service: $service"
        echo "  Tag:     $tag"

        SERVICE="$service" TAG="$tag" \
        yq -i '
          (.images[] | select(.name == env(SERVICE)).newTag) = env(TAG)
        ' overlays/dev/kustomization.yaml
      done

      if [ "$changed" -eq 0 ]; then
        echo "No changed services found."
        exit 0
      fi

    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@gitlab.local"

    - git add overlays/dev/kustomization.yaml

    - |
      if git diff --cached --quiet; then
        echo "No GitOps changes to commit."
        exit 0
      fi

    - git commit -m "update dev images ${CI_COMMIT_SHORT_SHA}"

    - git push origin main


# ============================================================
# Production Promotion Gate
# ============================================================

promote-prod:
  stage: promote
  image: alpine:3.22

  rules:
    - changes:
        - src/**/*

  script:
    - echo "========================================"
    - echo " Production Promotion"
    - echo "========================================"
    - echo ""
    - echo "Images from this pipeline:"
    - |
      for file in *.changed; do
        [ -f "$file" ] || continue
        cat "$file"
      done
    - echo ""
    - echo "These images were already built and scanned."
    - echo "Promoting them to production."

  when: manual
  allow_failure: false


# ============================================================
# Update Prod GitOps
# ============================================================

update-prod:
  stage: deploy-prod
  image: alpine:3.22

  rules:
    - changes:
        - src/**/*

  script:
    - apk add --no-cache git yq

    - git clone "https://oauth2:${GITOPS_TOKEN}@gitlab.local/online-boutique-gitops.git"

    - cd online-boutique-gitops

    - |
      set -eu

      changed=0

      for file in ../*.changed; do
        [ -f "$file" ] || continue

        changed=1

        service="$(awk '{print $1}' "$file")"
        tag="$(awk '{print $2}' "$file")"

        echo "Promoting to PROD:"
        echo "  Service: $service"
        echo "  Tag:     $tag"

        SERVICE="$service" TAG="$tag" \
        yq -i '
          (.images[] | select(.name == env(SERVICE)).newTag) = env(TAG)
        ' overlays/prod/kustomization.yaml
      done

      if [ "$changed" -eq 0 ]; then
        echo "No changed services found."
        exit 0
      fi

    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@gitlab.local"

    - git add overlays/prod/kustomization.yaml

    - |
      if git diff --cached --quiet; then
        echo "No GitOps changes to commit."
        exit 0
      fi

    - git commit -m "promote images ${CI_COMMIT_SHORT_SHA} to prod"

    - git push origin main