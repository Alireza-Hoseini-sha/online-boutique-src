stages:
  - build
  # - scan
  - deploy
  - promote
  - deploy-prod


# ============================================================
# Variables
# ============================================================

variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  NEXUS_REPOSITORY: "microservices-demo"


# ============================================================
# Build Template
# ============================================================

.build-template:
  stage: build
  image: docker:29.8.0

  script:
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin

    - |
      IMAGE="$NEXUS_REGISTRY/$NEXUS_REPOSITORY/$SERVICE:$IMAGE_TAG"

      echo "Building $IMAGE"
      echo "Context: $CONTEXT"

      docker build \
        -t "$IMAGE" \
        "$CONTEXT"

      echo "Pushing $IMAGE"

      docker push "$IMAGE"

    - echo "$SERVICE $IMAGE_TAG" > "$SERVICE.changed"

  artifacts:
    paths:
      - "$SERVICE.changed"
    expire_in: 1 day


# ============================================================
# Build Jobs
# ============================================================

build-adservice:
  extends: .build-template

  variables:
    SERVICE: "adservice"
    CONTEXT: "src/adservice"

  rules:
    - changes:
        - src/adservice/**/*


