stages:
  - build
  - deploy
  - promote
  - deploy-prod


variables:
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  NEXUS_REPOSITORY: "microservices-demo"


# ============================================================
# BUILD
# ============================================================

build:
  stage: build
  image: docker:29.8.0

  parallel:
    matrix:
      - SERVICE: "adservice"
        CONTEXT: "src/adservice"

      - SERVICE: "cartservice"
        CONTEXT: "src/cartservice/src"

      - SERVICE: "checkoutservice"
        CONTEXT: "src/checkoutservice"

      - SERVICE: "currencyservice"
        CONTEXT: "src/currencyservice"

      - SERVICE: "emailservice"
        CONTEXT: "src/emailservice"

      - SERVICE: "frontend"
        CONTEXT: "src/frontend"

      - SERVICE: "paymentservice"
        CONTEXT: "src/paymentservice"

      - SERVICE: "productcatalogservice"
        CONTEXT: "src/productcatalogservice"

      - SERVICE: "recommendationservice"
        CONTEXT: "src/recommendationservice"

      - SERVICE: "shippingservice"
        CONTEXT: "src/shippingservice"

  script:
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
    - |
      IMAGE="$NEXUS_REGISTRY/$NEXUS_REPOSITORY/$SERVICE:$IMAGE_TAG"

      echo "========================================"
      echo "Building service"
      echo "Service: $SERVICE"
      echo "Context: $CONTEXT"
      echo "Image:   $IMAGE"
      echo "========================================"

      docker build \
        -t "$IMAGE" \
        "$CONTEXT"

      echo "========================================"
      echo "Pushing image"
      echo "Image: $IMAGE"
      echo "========================================"

      docker push "$IMAGE"

      echo "Successfully pushed $IMAGE"


# ============================================================
# DEPLOY TO DEV
# ============================================================

update-dev:
  stage: deploy
  image: alpine:3.22

  script:
    - apk add --no-cache git yq
    - git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/Alireza-Hoseini-sha/online-boutique-gitops.git"
    - cd online-boutique-gitops

    - |
      echo "========================================"
      echo "Updating DEV"
      echo "Image tag: $CI_COMMIT_SHORT_SHA"
      echo "========================================"

      for service in \
        adservice \
        cartservice \
        checkoutservice \
        currencyservice \
        emailservice \
        frontend \
        paymentservice \
        productcatalogservice \
        recommendationservice \
        shippingservice
      do
        echo "Updating $service -> $CI_COMMIT_SHORT_SHA"

        SERVICE="$service" TAG="$CI_COMMIT_SHORT_SHA" \
        yq -i '
          (.images[] | select(.name == env(SERVICE)).newTag) = env(TAG)
        ' overlays/dev/kustomization.yaml
      done

    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@gitlab.local"
    - git add overlays/dev/kustomization.yaml

    - |
      if git diff --cached --quiet; then
        echo "No GitOps changes to commit."
        exit 0
      fi

    - git commit -m "deploy $CI_COMMIT_SHORT_SHA to dev"
    - git push origin main


# ============================================================
# MANUAL PRODUCTION PROMOTION
# ============================================================

promote-prod:
  stage: promote

  script:
    - |
      echo "========================================"
      echo "Production Promotion"
      echo "========================================"
      echo "DEV deployment completed."
      echo "Promoting image tag: $CI_COMMIT_SHORT_SHA"
      echo "The same images will be deployed to PROD."

  when: manual
  allow_failure: false


# ============================================================
# DEPLOY TO PROD
# ============================================================

update-prod:
  stage: deploy-prod
  image: alpine:3.22

  needs:
    - promote-prod

  script:
    - apk add --no-cache git yq
    - git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/Alireza-Hoseini-sha/online-boutique-gitops.git"
    - cd online-boutique-gitops

    - |
      echo "========================================"
      echo "Updating PROD"
      echo "Image tag: $CI_COMMIT_SHORT_SHA"
      echo "========================================"

      for service in \
        adservice \
        cartservice \
        checkoutservice \
        currencyservice \
        emailservice \
        frontend \
        paymentservice \
        productcatalogservice \
        recommendationservice \
        shippingservice
      do
        echo "Updating $service -> $CI_COMMIT_SHORT_SHA"

        SERVICE="$service" TAG="$CI_COMMIT_SHORT_SHA" \
        yq -i '
          (.images[] | select(.name == env(SERVICE)).newTag) = env(TAG)
        ' overlays/prod/kustomization.yaml
      done

    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@gitlab.local"
    - git add overlays/prod/kustomization.yaml

    - |
      if git diff --cached --quiet; then
        echo "No GitOps changes to commit."
        exit 0
      fi

    - git commit -m "promote $CI_COMMIT_SHORT_SHA to prod"
    - git push origin main