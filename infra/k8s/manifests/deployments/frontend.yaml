apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  labels:
    app: frontend
  namespace: online-boutique
spec:
#  replicas: 2   # Line is commented because we used hpa. In futer applies it will overwrite hpa's min replicas at first.
  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
  #    serviceAccountName: frontend # The service account to use for the container
      automountServiceAccountToken: false # Whether to automatically mount a service account token to the container
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend:v0.10.6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          envFrom:
            - configMapRef:
                name: frontend
          resources:
            requests: # The minimum resources required to run the container, I SHOULD CHANGE THIS LATER
              cpu: 100m
              memory: 64Mi
            limits: # The maximum resources that can be used by the container, I SHOULD CHANGE THIS LATER
              cpu: 200m
              memory: 128Mi