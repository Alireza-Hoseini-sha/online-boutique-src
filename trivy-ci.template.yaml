
# ============================================================
# Scan Template
# ============================================================

.scan-template:
  stage: scan

  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]

  script:
    - |
      IMAGE="$NEXUS_REGISTRY/$NEXUS_REPOSITORY/$SERVICE:$IMAGE_TAG"

      echo "Scanning $IMAGE"

      trivy image \
        --insecure \
        --username "$NEXUS_USERNAME" \
        --password "$NEXUS_PASSWORD" \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        "$IMAGE"


# ============================================================
# Scan Jobs
# ============================================================

scan-adservice:
  extends: .scan-template

  variables:
    SERVICE: "adservice"

  needs:
    - job: build-adservice

  rules:
    - changes:
        - src/adservice/**/*


